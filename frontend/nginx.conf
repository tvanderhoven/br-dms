server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Muss zum Multipart-Limit des Backends passen (siehe backend/src/index.ts)
  client_max_body_size 50m;

  # Backend-API – ermoeglicht relative "/api"-Pfade im Frontend (siehe
  # VITE_API_URL in docker-compose.yml), egal ob direkt oder ueber den
  # vorgeschalteten HTTPS-Proxy (proxy/nginx.conf) aufgerufen wird.
  location /api/ {
    proxy_pass         http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # index.html nie cachen – immer aktuellen Stand laden
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # React Router: alle Routen auf index.html (kein Caching für HTML)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Assets mit Hash im Dateinamen dürfen lang gecacht werden
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/html text/css application/javascript application/json;
}
