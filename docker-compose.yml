# ================================================================
#  BR-DMS – Synology Container Manager
#  Intranet-Betrieb, ausschließlich über HTTPS erreichbar:
#  https://<NAS-IP-oder-Hostname>:${PROXY_HTTPS_PORT:-8443}
#  (Frontend/Backend haben keine eigenen Host-Ports mehr, siehe proxy/)
# ================================================================

networks:
  brdms_net:
    driver: bridge
    # Kein External-Zugriff auf interne Dienste außer über definierte Ports
    internal: false

services:

  # ----------------------------------------------------------------
  #  PostgreSQL 16
  #  Nur intern erreichbar – kein Port-Mapping nach außen
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: brdms_postgres
    restart: unless-stopped
    networks:
      - brdms_net
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Absichtlich kein ports:-Block → nur internes Netz

  # ----------------------------------------------------------------
  #  Backend (Fastify + Prisma)
  #  Kein direkter Port nach außen mehr - nur über den HTTPS-Proxy erreichbar
  #  (Frontend-Nginx leitet /api intern an backend:4000 weiter, siehe
  #  frontend/nginx.conf). BACKEND_PORT nur noch fuer den Healthcheck relevant.
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brdms_backend
    restart: unless-stopped
    networks:
      - brdms_net
    environment:
      NODE_ENV:        ${NODE_ENV:-production}
      DATABASE_URL:    postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET:      ${JWT_SECRET}
      ENCRYPTION_KEY:  ${ENCRYPTION_KEY}
      STORAGE_PATH:    /data/storage
      BACKUP_PATH:     /data/backups
      PUID:            ${PUID:-1000}
      PGID:            ${PGID:-100}
      SMTP_HOST:       ${SMTP_HOST}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USER:       ${SMTP_USER}
      SMTP_PASS:       ${SMTP_PASS}
      SMTP_FROM:       ${SMTP_FROM}
      APP_URL:         ${APP_URL}
      WATCH_FOLDER:         ${WATCH_FOLDER:-/data/watch_inbox}
      WATCH_FOLDER_ENABLED: ${WATCH_FOLDER_ENABLED:-false}
      WATCH_INBOX_PATH:     ${WATCH_INBOX_PATH:-}
      SYSTEM_USER_ID:       ${SYSTEM_USER_ID:-}
      # Erster Admin-Account – wird beim ersten Start angelegt, solange es noch keinen Benutzer gibt
      ADMIN_EMAIL:          ${ADMIN_EMAIL:-admin@br-dms.lokal}
      ADMIN_PASSWORD:       ${ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - ${DATA_PATH}/storage:/data/storage
      - ${DATA_PATH}/logs:/data/logs
      - ${WATCH_INBOX_PATH:-${DATA_PATH}/watch_inbox}:/data/watch_inbox
      - ${DATA_PATH}/backups:/data/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------
  #  Frontend (React/Vite, via Nginx im Container)
  #  Kein direkter Port nach außen mehr - nur über den HTTPS-Proxy erreichbar
  #  (siehe proxy/nginx.conf). FRONTEND_PORT wird nicht mehr benoetigt.
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leer = relative "/api"-Pfade, damit es hinter dem HTTPS-Proxy unter
        # jeder Origin funktioniert (Proxy leitet /api/* zum Backend weiter).
        VITE_API_URL: ""
    container_name: brdms_frontend
    restart: unless-stopped
    networks:
      - brdms_net
    depends_on:
      backend:
        condition: service_healthy

  # ----------------------------------------------------------------
  #  Reverse-Proxy (Nginx) – terminiert TLS, fuehrt Frontend+Backend
  #  unter einer gemeinsamen HTTPS-Adresse zusammen. Siehe README,
  #  Abschnitt "HTTPS aktivieren" fuer die Zertifikat-Einrichtung.
  # ----------------------------------------------------------------
  proxy:
    image: nginx:1.25-alpine
    container_name: brdms_proxy
    restart: unless-stopped
    networks:
      - brdms_net
    environment:
      PROXY_HTTPS_PORT: ${PROXY_HTTPS_PORT:-8443}
    ports:
      - "${PROXY_HTTPS_PORT:-8443}:443"
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${DATA_PATH}/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
