# BR-DMS Reverse Proxy – terminiert nur TLS. Die Aufteilung zwischen
# statischen Frontend-Dateien und /api-Weiterleitung ans Backend übernimmt
# bereits das frontend/nginx.conf im Frontend-Container - hier wird alles
# einfach an "frontend" durchgereicht, damit relative "/api"-Pfade im
# Frontend unabhängig vom Zugriffsweg (direkt oder über diesen Proxy)
# funktionieren (siehe VITE_API_URL in docker-compose.yml).
#
# Zertifikate erwartet unter /etc/nginx/certs/fullchain.pem + privkey.pem -
# das sind dieselben Dateinamen, die Let's Encrypt/certbot erzeugt, ein
# spaeterer Wechsel vom selbstsignierten Zertifikat auf ein echtes ist also
# nur ein Dateitausch, keine Config-Aenderung noetig.
#
# Die Datei wird als Vorlage eingebunden (/etc/nginx/templates/): beim Start
# ersetzt nginx ${PROXY_HTTPS_PORT}, ${PROXY_HTTP_PORT} und ${FRONTEND_INTERN_PORT}
# durch die Werte aus der .env. Nginx-eigene Variablen wie $host bleiben
# unveraendert, ersetzt werden nur gesetzte Umgebungsvariablen.
#
# Der Proxy laeuft im Netz des Hosts (network_mode: host, siehe docker-compose.yml),
# damit $remote_addr der Arbeitsplatz ist und nicht das Docker-Gateway. Darum
# lauscht er direkt auf den Host-Ports und erreicht das Frontend ueber dessen nur
# lokal freigegebenen Port. Bewusst nur IPv4: Browser weichen dann von IPv6 auf
# IPv4 aus, und im Audit-Log stehen vertraute Adressen wie 192.168.178.x.

server {
  listen ${PROXY_HTTP_PORT};
  server_name _;
  server_tokens off;
  return 301 https://$host:${PROXY_HTTPS_PORT}$request_uri;
}

server {
  listen ${PROXY_HTTPS_PORT} ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Muss zum Multipart-Limit des Backends passen (siehe backend/src/index.ts)
  client_max_body_size 50m;

  # nginx-Version nicht verraten
  server_tokens off;

  # --- Sicherheits-Header --------------------------------------------
  # Content-Security-Policy: Skripte nur von hier – eingeschleustes HTML kann so kein
  # Skript nachladen oder inline ausführen. Ausnahmen, die die App braucht:
  #   style 'unsafe-inline' – style-Attribute in React-Komponenten
  #   img https:            – Favicons der verlinkten Seiten (Ressourcen)
  #   blob:                 – PDF-Vorschau und Downloads im Browser
  # frame-ancestors 'none' + X-Frame-Options: BR-DMS lässt sich nicht in fremde Seiten
  # einbetten (Schutz vor untergeschobenen Klicks). HSTS gilt erst, wenn das Zertifikat
  # im Browser als vertrauenswürdig gilt – mit Zertifikatswarnung ignorieren Browser es.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options           "DENY" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "no-referrer" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    # Fester lokaler Port statt Containername: bleibt auch nach einem Update gleich
    proxy_pass         http://127.0.0.1:${FRONTEND_INTERN_PORT};
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
