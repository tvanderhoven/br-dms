# Rollentests: prüft bei jedem Push und Pull Request, welche Rolle welche
# API-Route aufrufen darf (backend/test/). Läuft gegen eine leere Wegwerf-
# Datenbank auf dem Actions-Runner – echte Daten gibt es hier nicht.
name: Rollentests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rollentests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Das auf dem Runner vorinstallierte PostgreSQL wird nur gestartet. Ein
      # Docker-Image zu laden scheiterte regelmäßig an Download-Limits
      # (toomanyrequests), dann liefen die Tests gar nicht erst an.
      - name: Test-Datenbank starten
        working-directory: .
        run: |
          sudo systemctl start postgresql.service
          until sudo -u postgres pg_isready; do sleep 1; done
          sudo -u postgres psql -c "CREATE USER test WITH SUPERUSER PASSWORD 'test';"
          sudo -u postgres createdb -O test brdms_test
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/brdms_test
