# Dependabot: schlägt wöchentlich Updates als Pull Request vor.
# Sicherheitsupdates kommen unabhängig davon sofort, sobald eine Lücke bekannt wird
# (Einstellung „Dependabot security updates“ im Repository).
# Kleine Updates (Minor/Patch) werden je Bereich zu einem Pull Request gebündelt,
# damit es nicht jede Woche ein Dutzend einzelne gibt.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-klein:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-klein:
        update-types: [minor, patch]

  # Basis-Images in den Dockerfiles (node, nginx)
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }

  # Images in docker-compose.yml (postgres, nginx-Proxy)
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }

  # Versionen der GitHub-Actions im CodeQL-Workflow
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
